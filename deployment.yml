apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-demo
  labels:
    app: node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          image: jamil255/node-app:11
          ports:
            - containerPort: 3000
              
---
apiVersion: v1
kind: Service
metadata:
  name: my-demo-app
  labels:
    app: node-app
spec:
  type: LoadBalancer
  selector:
    app: node-app
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 3000
